# Signal Archive — VPS Docker Compose
#
# Services:
#   postgres — self-hosted Postgres 17 (replaces Neon)
#   redis    — BullMQ state store
#   chrome   — Headless Google Chrome, CDP on :9223 via chrome-proxy.cjs
#   worker   — BullMQ workers: deletion detection, HCS attestation, severity scoring
#   ingest   — node-cron daemon: schedules browser-ingest.ts --cdp on tier schedule
#   web      — Next.js app (replaces Railway)
#   caddy    — Reverse proxy + automatic SSL (replaces Railway ingress)
#
# Run from project root:
#   docker compose -p signal-archive -f deploy/docker-compose.yml up -d
#
# Required env vars (in .env at project root):
#   DATABASE_URL, REDIS_URL, CDP_URL, HEDERA_*, ANTHROPIC_API_KEY
#   POSTGRES_PASSWORD — internal Postgres password
#   NEXT_PUBLIC_* — baked into web image at build time via build args
#   SOCKS5_PROXY_URL — home node Tailscale SOCKS5 for residential egress (Chrome only)
#
# Chrome profile persistence:
#   The chrome-profile volume is mounted to /data/chrome-profile in the chrome service.
#   Session cookies and login state survive container restarts.

services:

  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: tweet_accountability
      POSTGRES_USER: taa
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Chrome (CDP target) ────────────────────────────────────────────────────
  # Headless Google Chrome with remote debugging port exposed to internal network.
  # Traffic egresses via SOCKS5_PROXY_URL (home node Tailscale) for residential IP.
  # Profile volume ensures session cookies survive restarts — DO NOT delete chrome-profile volume.
  chrome:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    restart: on-failure
    command: ["sh", "/app/deploy/chrome-start.sh"]
    volumes:
      - chrome-profile:/data/chrome-profile
    expose:
      - "9223"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Worker (BullMQ) ────────────────────────────────────────────────────────
  # Processes: deletion detection, HCS attestation submission, severity scoring.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - redis
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ingest (cron daemon) ───────────────────────────────────────────────────
  # Schedules browser-ingest.ts --cdp on a tier-based cron.
  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    restart: on-failure
    env_file: ../.env
    depends_on:
      - chrome
      - redis
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  # Built from Dockerfile.web. NEXT_PUBLIC_* vars baked in at build time via args.
  # Runtime secrets (DATABASE_URL, HEDERA_*, etc.) injected via env_file.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_BADGE_TOKEN_ID: ${NEXT_PUBLIC_BADGE_TOKEN_ID}
        NEXT_PUBLIC_DONATION_ACCOUNT_ID: ${NEXT_PUBLIC_DONATION_ACCOUNT_ID}
        NEXT_PUBLIC_HEDERA_NETWORK: ${NEXT_PUBLIC_HEDERA_NETWORK}
        NEXT_PUBLIC_USDC_TOKEN_ID: ${NEXT_PUBLIC_USDC_TOKEN_ID}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
    env_file: ../.env
    expose:
      - "3000"
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy (reverse proxy + SSL) ────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg-data:
    external: true
    name: deploy_pg-data
  redis-data:
    external: true
    name: deploy_redis-data
  chrome-profile:
    external: true
    name: deploy_chrome-profile
    # Contains the X/Twitter login session — treat as sensitive persistent state.
  caddy-data:
    driver: local
  caddy-config:
    driver: local
